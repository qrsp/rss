name: Generate Morphe RSS Feed

on:
  schedule:
    - cron: '10 20,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate RSS Feed
        working-directory: morphe
        run: python generate_rss.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add morphe/feed.xml morphe/known_apps.txt || true
          
          if git diff --staged --quiet; then
            echo "No changes in feed.xml or known_apps.txt. Skipping commit."
          else
            echo "Changes detected in RSS feed or known apps log. Committing..."
            git commit -m "chore(morphe): update RSS feed [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
