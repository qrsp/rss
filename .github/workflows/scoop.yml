name: Generate Scoop RSS Feed

on:
  schedule:
    # Daily at 06:20 Taiwan Time (UTC+8 / 22:20 UTC)
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Tests
        working-directory: scoop
        run: python -m unittest test_generate_rss.py

      - name: Generate RSS Feed
        working-directory: scoop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_rss.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add scoop/feed.xml scoop/known_apps.txt || true
          
          if git diff --staged --quiet; then
            echo "No changes in scoop feed or known_apps. Skipping commit."
          else
            git commit -m "chore(scoop): update RSS feed and known_apps [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
