name: Check F-Droid & IzzyOnDroid Updates

on:
  schedule:
    # Runs daily at 06:00 Taiwan Time (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'fdroid/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fdroid/requirements.txt

      - name: Run F-Droid check script
        working-directory: fdroid
        run: |
          python check_fdroid.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add fdroid/known_apps.txt fdroid/last_timestamp_fdroid.txt fdroid/last_timestamp_izzy.txt fdroid/feed.xml || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(fdroid): update RSS feed and tracking state [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
